# Atiya Studio's preview installer (documentation/desktop/plan.md, stage 9P): a per-user Windows installer, unsigned,
# with the site's engine (packed from this commit) and git inside. Run by hand, it leaves the installer as the run's
# artifact; on a studio-v<version> tag it also makes a draft pre-release for the owner to look at and publish. It
# never signs, never publishes by itself, and never touches the site's deploy.
name: Studio preview installer

on:
  workflow_dispatch:
  push:
    tags: ['studio-v*']

permissions:
  contents: write

concurrency:
  group: studio-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        # PowerShell, so `tar` is Windows' own (bsdtar), as on the owner's computer: Git Bash's GNU tar reads a
        # drive letter in a path (D:\…) as a remote host
        shell: pwsh
    steps:
      - name: Check out the engine and the app
        uses: actions/checkout@v7

      - name: The tag is the app's version
        if: startsWith(github.ref, 'refs/tags/studio-v')
        run: |
          $version = node -p 'require("./apps/desktop/package.json").version'
          if ("studio-v$version" -ne $env:GITHUB_REF_NAME) {
            Write-Output "::error::The tag $env:GITHUB_REF_NAME doesn't match apps/desktop/package.json's version $version."
            exit 1
          }

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # the lockfiles were written through a package-feed mirror of the public registry: the same tarballs and
      # integrity hashes come from the public registry here, as in the site's workflows
      - name: Use the public npm registry
        run: |
          $lock = 'apps/desktop/package-lock.json'
          (Get-Content $lock -Raw) -replace 'https://[^"]+/npm/registry/', 'https://registry.npmjs.org/' | Set-Content $lock -NoNewline
          npm config set registry https://registry.npmjs.org/

      - name: Pack the engine at this commit
        run: node scripts/pack-engine.mjs --out "$env:RUNNER_TEMP/engine-rel"

      - name: Install the app's packages
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Bundle the engine into the app
        run: |
          $archive = (Get-ChildItem "$env:RUNNER_TEMP/engine-rel" -Filter 'engine-*.tgz' | Select-Object -First 1).FullName
          node apps/desktop/scripts/bundle-engine.mjs --engine $archive --public-registry

      - name: Build the installer, and check it
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Keep the installer with the run
        uses: actions/upload-artifact@v7
        with:
          name: atiya-studio-preview-${{ github.sha }}
          path: |
            apps/desktop/dist/Atiya-Studio-Setup-*.exe
            apps/desktop/dist/Atiya-Studio-Setup-*.exe.blockmap
          if-no-files-found: error
          retention-days: 30

      - name: A draft pre-release, for the owner to publish
        if: startsWith(github.ref, 'refs/tags/studio-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem apps/desktop/dist -Filter 'Atiya-Studio-Setup-*.exe' | Select-Object -First 1).FullName
          $version = $env:GITHUB_REF_NAME -replace '^studio-v', ''
          gh release create $env:GITHUB_REF_NAME $installer --draft --prerelease --title "Atiya Studio $version (preview)" --notes "A preview for testers: unsigned, so Windows SmartScreen warns about an unknown publisher (More info, then Run anyway). Installs for you alone; no administrator needed."
