<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
<title>Showreel: a 90-second film made of live page content</title>
<desc>The stage plays chapter 3 of 8, Design leadership: its proof, a visual in motion and a quote, with Open this, which pauses the reel and opens the evidence. Below the stage, eight progress segments are labelled with the chapter names, so all six capabilities are named before anything plays. Pause, Previous, Next and the reading speed are always visible, and a transcript gives the whole reel as text. On a phone the stage is 4:5, with its controls below, then a still line naming the six capabilities, then the transcript.</desc>
<text class="label" x="40" y="40">Wide screen, 1280 px</text>
<text class="label" x="740" y="40">Phone, 360 px</text>
<g id="wide">
<rect class="src" x="40" y="56" width="660" height="580" rx="16" />
</g>
<g id="strip">
<rect class="chip" x="56" y="72" width="628" height="44" rx="10" />
<text class="chip-name" x="72" y="100">Prabin Pebam</text>
<text class="note" x="452" y="100">Résumé · Contact · Change view</text>
</g>
<g id="stage">
<rect class="out" x="56" y="128" width="628" height="300" rx="16" />
<text class="out-note" x="76" y="156">Chapter 3 of 8 · 0:24</text>
<text class="out-name" x="76" y="190">Design leadership</text>
<text class="out-note" x="76" y="214">Built Belong's design org from scratch;</text>
<text class="out-note" x="76" y="234">leads teams of 5 to 9 designers at Microsoft</text>
<rect class="later" x="76" y="254" width="300" height="150" rx="12" />
<text class="label" x="92" y="322">Visual: the team's own</text>
<text class="label" x="92" y="340">rebrand art, in motion</text>
<text class="out-note" x="400" y="286">“one of the most complete</text>
<text class="out-note" x="400" y="306">design leaders I know”</text>
<text class="out-note" x="400" y="330">March Roger, Partner Design</text>
<text class="out-note" x="400" y="348">Director, Windows</text>
<rect class="chip" x="400" y="364" width="150" height="40" rx="10" />
<text class="line" x="416" y="389">Open this</text>
</g>
