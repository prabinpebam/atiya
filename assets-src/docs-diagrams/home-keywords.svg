<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
<title>Keywords: pick what you hire for, see the evidence that matches</title>
<desc>A field of keywords is grouped by capability; a larger keyword has more evidence behind it. Two picks, Product strategy and Agentic AI, sit in the tray at the top with Clear all. The results panel lists what matches, best first, each card saying which pick it matches: AI transformation, Cloner Pro and Microsoft Family. With nothing picked, the results show all six capabilities. On a phone, the field is a list of the six groups, each opening its keywords, and the results follow it.</desc>
<text class="label" x="40" y="40">Wide screen, 1280 px</text>
<text class="label" x="740" y="40">Phone, 360 px</text>
<g id="wide">
<rect class="src" x="40" y="56" width="660" height="580" rx="16" />
</g>
