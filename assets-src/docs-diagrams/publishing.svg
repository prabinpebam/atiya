<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520">
<title>Drafts and publishing: drafts stay private, published versions go public</title>
<desc>Edit mode writes every page's working copy into the private repository's main branch and keeps every version there as a commit, pushed in the background as a backup. Publish copies the pages and site changes you choose into the public repository's content folder and commits it: one commit per Publish, holding only published versions. The build reads the public repository for public pages and the private repository for private pages, and deploys the site. Drafts and the versions between publishes never reach the public repository.</desc>
<g id="editor">
<rect class="src" x="40" y="40" width="200" height="140" rx="18" />
<text class="name" x="60" y="72">Edit mode</text>
<text class="note" x="60" y="94">on your computer</text>
<text class="line" x="60" y="132">Saves every edit</text>
<text class="line" x="60" y="160">Keeps versions</text>
</g>
<g id="private">
<rect class="docs" x="300" y="40" width="300" height="170" rx="18" />
<text class="name" x="320" y="72">Private repository</text>
<text class="note" x="320" y="94">your work: never public</text>
<text class="line" x="320" y="132">Drafts and changes</text>
<text class="line" x="320" y="160">Every version: the timeline</text>
<text class="line" x="320" y="188">Private pages, comments</text>
</g>
<g id="public">
<rect class="box" x="660" y="40" width="300" height="170" rx="18" />
<text class="name" x="680" y="72">Public repository</text>
<text class="note" x="680" y="94">what you published</text>
<text class="line" x="680" y="132">One commit per Publish</text>
<text class="line" x="680" y="160">Published versions only</text>
<text class="line" x="680" y="188">No drafts, no process</text>
</g>
<g id="build">
<rect class="box" x="660" y="290" width="300" height="80" rx="16" />
<text class="name" x="680" y="322">The build</text>
<text class="note" x="680" y="344">published pages from both</text>
</g>
<g id="site">
<rect class="out" x="300" y="290" width="300" height="80" rx="16" />
<text class="out-name" x="320" y="322">Your site</text>
<text class="out-note" x="320" y="344">published pages; private ones sealed</text>
</g>
<text class="label" x="248" y="100">writes</text>
<text class="label" x="608" y="100">Publish</text>
<text class="label" x="820" y="256">push</text>
<text class="label" x="608" y="320">deploys</text>
<text class="label" x="460" y="256">private pages, with its key</text>
<text class="label" x="40" y="470">Your first drafts and how a page took shape stay private; the public history shows only the versions you published.</text>
<path class="arrow" d="M240 110 H297" />
<path class="arrow" d="M600 125 H657" />
<path class="arrow" d="M810 210 V287" />
<path class="arrow" d="M660 330 H603" />
<path class="dashed" d="M450 210 V240 H700 V287" />
</svg>
