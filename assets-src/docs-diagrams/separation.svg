<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510">
<title>Two apps, joined only through two packages and the composed build</title>
<desc>On the left, apps/site: an Astro project on its own dev server with the landing, the classic and IA pages, the design library and the docs, and its own dependencies, tests and budgets. On the right, apps/planet: an Astro page with React and three, holding /play/ (the gate and the game) and the game's textures, models and audio, with its own dependencies, tests and budgets. Between them, the only code both import: packages/content (the content contract and each channel's view) and packages/platform (withBase, the routes they link to, and the mode memory). Below, a compose step merges the two builds, refusing any path both write and checking every link, into one dist folder published on GitHub Pages.</desc>
<g id="site">
<rect class="box" x="40" y="40" width="300" height="200" rx="16" />
<text class="name" x="60" y="72">apps/site</text>
<text class="note" x="60" y="94">Astro, on its own dev server</text>
<text class="line" x="60" y="132">Landing, classic, IA pages</text>
<text class="line" x="60" y="162">Design library, the docs</text>
<text class="line" x="60" y="192">Its own deps, tests, budgets</text>
</g>
<g id="planet">
<rect class="box" x="660" y="40" width="300" height="200" rx="16" />
<text class="name" x="680" y="72">apps/planet</text>
<text class="note" x="680" y="94">Astro page, React and three</text>
<text class="line" x="680" y="132">/play/: the gate, the game</text>
<text class="line" x="680" y="162">Textures, models, audio</text>
<text class="line" x="680" y="192">Its own deps, tests, budgets</text>
</g>
<g id="content">
<rect class="docs" x="380" y="40" width="240" height="90" rx="16" />
<text class="name" x="400" y="72">packages/content</text>
<text class="note" x="400" y="94">contract, channel views</text>
</g>
<g id="platform">
<rect class="docs" x="380" y="150" width="240" height="90" rx="16" />
<text class="name" x="400" y="182">packages/platform</text>
<text class="note" x="400" y="204">withBase, routes, mode</text>
</g>
<g id="compose">
<rect class="box" x="380" y="300" width="240" height="70" rx="16" />
<text class="name" x="400" y="330">scripts/compose</text>
<text class="note" x="400" y="352">merges, checks links</text>
</g>
<g id="dist">
<rect class="out" x="380" y="420" width="240" height="60" rx="16" />
<text class="out-name" x="400" y="448">dist/</text>
<text class="out-note" x="400" y="468">one site on GitHub Pages</text>
</g>
<text class="label" x="424" y="276">the only shared imports</text>
<path class="arrow" d="M380 85 H343" />
<path class="arrow" d="M620 85 H657" />
<path class="arrow" d="M380 195 H343" />
<path class="arrow" d="M620 195 H657" />
<path class="arrow" d="M190 240 V335 H377" />
<path class="arrow" d="M810 240 V335 H623" />
<path class="arrow" d="M500 370 V417" />
</svg>
