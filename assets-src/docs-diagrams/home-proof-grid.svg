<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
<title>Proof grid: every capability against the kinds of evidence for it</title>
<desc>A grid lists the six capabilities as rows, each with its proof line, against five kinds of evidence: shipped, led, built, wrote and said by colleagues. A filled cell has at least one page or recommendation on the site; an outlined cell rests on résumé lines only; an empty cell has none. Each number is a count, and a cell opens its evidence. On a phone, the grid becomes an accordion with one capability open.</desc>
<text class="label" x="40" y="40">Wide screen, 1280 px</text>
<text class="label" x="740" y="40">Phone, 360 px</text>
<g id="wide">
<rect class="src" x="40" y="56" width="660" height="580" rx="16" />
</g>
<g id="strip">
<rect class="chip" x="56" y="72" width="628" height="44" rx="10" />
<text class="chip-name" x="72" y="100">Prabin Pebam</text>
<text class="note" x="452" y="100">Résumé · Contact · Change view</text>
</g>
<g id="grid">
