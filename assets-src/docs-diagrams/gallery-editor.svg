<text class="note" x="712" y="510">Several: date, place and</text>
<text class="note" x="712" y="532">downloads set at once</text>
<text class="note" x="712" y="580">Album tab: facts, words,</text>
<text class="note" x="712" y="602">where it is, how it shows</text>
