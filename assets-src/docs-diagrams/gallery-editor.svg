<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
<title>The album editor</title>
<desc>The album editor, a studio in three columns under its header. The header holds the album's title and its actions: Undo, Redo, Add, View on the site and Publish. On the left, the list of albums, docked: the gallery and its albums, the open one marked. In the middle, the album: the Cover section, its heading marked Automatic with Edit cover at its end, and the cover as its band will look; then the Pictures and videos section, its heading with the album's order at the end, and every item in a grid of thumbnails in that order, some selected, with a text card across the grid between two rows and an Add tile at the end. A selection bar shows under the grid while items are selected: one row of icon buttons to move them, remove them and clear the selection. On the right, the inspector, with two tabs. The Selection tab shows what's selected: for one picture, its preview with View large, then its caption, description, alt text, date taken, place, downloads and the other albums it's in; for several, the date and place set on all of them at once, and their downloads. The Album tab holds the album's facts with Review, its title and words, where it is and how it shows, and Delete album.</desc>
<g id="frame">
<rect class="src" x="40" y="40" width="920" height="620" rx="16" />
<rect class="chip" x="56" y="56" width="888" height="44" rx="10" />
<text class="chip-name" x="72" y="84">Albums / Summer sketches</text>
<text class="note" x="560" y="84">Undo · Redo · Add · View on the site · Publish</text>
</g>
<g id="list">
<rect class="box" x="56" y="112" width="176" height="536" rx="14" />
<text class="name" x="72" y="140">Albums</text>
<rect class="chip" x="68" y="156" width="152" height="40" rx="8" />
<text class="note" x="80" y="181">Gallery</text>
<rect class="out" x="68" y="204" width="152" height="40" rx="8" />
<text class="out-note" x="80" y="229">Summer sketches</text>
<rect class="chip" x="68" y="252" width="152" height="40" rx="8" />
<text class="note" x="80" y="277">Monsoon walks</text>
<rect class="chip" x="68" y="300" width="152" height="40" rx="8" />
<text class="note" x="80" y="325">Project notes</text>
</g>
