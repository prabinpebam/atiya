<rect class="src" x="468" y="328" width="96" height="72" rx="8" />
<rect class="src" x="572" y="328" width="96" height="72" rx="8" />
<rect class="later" x="260" y="408" width="408" height="40" rx="8" />
<text class="note" x="276" y="433">Text card: words between pictures</text>
<rect class="src" x="260" y="456" width="96" height="72" rx="8" />
<rect class="out" x="364" y="456" width="96" height="72" rx="8" />
<rect class="src" x="468" y="456" width="96" height="72" rx="8" />
