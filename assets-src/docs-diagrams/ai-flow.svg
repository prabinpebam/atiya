<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470">
<title>AI editing: one edit request for every feature</title>
<desc>Every AI feature starts from a scope: a block, a section, the whole article, an empty page, or the open comments. Edit mode turns it into one edit request: the instruction, the context and the changes allowed. A provider answers with proposed changes as JSON, never with files. Edit mode checks them against the content contract and the store; a refused answer is retried once with the reasons. You review the proposal as one diff, accept or reject each change, and accepting applies it as one undo step, with a version kept just before.</desc>
<g id="scope">
<rect class="src" x="40" y="40" width="200" height="140" rx="18" />
<text class="name" x="60" y="72">Scope</text>
<text class="note" x="60" y="94">what you point at</text>
<text class="line" x="60" y="132">A block, a section</text>
<text class="line" x="60" y="160">The article, comments</text>
</g>
<g id="request">
<rect class="box" x="290" y="40" width="200" height="140" rx="18" />
<text class="name" x="310" y="72">Edit request</text>
<text class="note" x="310" y="94">one contract for all</text>
<text class="line" x="310" y="132">Instruction, context</text>
<text class="line" x="310" y="160">Changes allowed</text>
</g>
<g id="provider">
<rect class="box" x="540" y="40" width="200" height="140" rx="18" />
<text class="name" x="560" y="72">Provider</text>
<text class="note" x="560" y="94">any connected service</text>
<text class="line" x="560" y="132">Answers with changes</text>
<text class="line" x="560" y="160">as JSON, never files</text>
</g>
<g id="check">
<rect class="gate" x="790" y="40" width="180" height="140" rx="18" />
<text class="name" x="810" y="72">Check</text>
<text class="note" x="810" y="94">contract and store</text>
<text class="line" x="810" y="132">Valid blocks only</text>
<text class="line" x="810" y="160">Real media only</text>
</g>
<g id="review">
<rect class="box" x="540" y="290" width="240" height="90" rx="16" />
<text class="name" x="560" y="322">Review</text>
<text class="note" x="560" y="346">one diff, each change kept or not</text>
</g>
<g id="apply">
<rect class="out" x="240" y="290" width="250" height="90" rx="16" />
<text class="out-name" x="260" y="322">Apply</text>
<text class="out-note" x="260" y="346">one undo step, a version before</text>
</g>
<text class="label" x="246" y="100">ask</text>
<text class="label" x="496" y="100">send</text>
<text class="label" x="744" y="100">reply</text>
<text class="label" x="700" y="226">refused: asked again once, with why</text>
<text class="label" x="890" y="262">valid</text>
<text class="label" x="496" y="322">accept</text>
<text class="label" x="40" y="430">Nothing reaches the article before you accept it. Accepting saves through the store, like any edit.</text>
<path class="arrow" d="M240 110 H287" />
<path class="arrow" d="M490 110 H537" />
<path class="arrow" d="M740 110 H787" />
<path class="dashed" d="M820 180 V205 H700 V183" />
<path class="arrow" d="M930 180 V335 H783" />
<path class="arrow" d="M540 335 H493" />
</svg>
