<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510">
<title>Three more ideas: Career river, Two sides and The short version</title>
<desc>Career river draws the career as one line, from TVS Motor in 2008 through Projectplace and Belong to Microsoft in 2019; each stop opens its roles and proof. Two sides splits the home into the leader and the maker, after a colleague called that a rare combination; a divider is dragged, or Leader and Maker are pressed. The short version is a one-page brief to print or share, which is also the link preview image.</desc>
<g id="river">
<rect class="box" x="40" y="40" width="280" height="400" rx="18" />
<text class="name" x="60" y="72">Career river</text>
<text class="note" x="60" y="94">the career as one line</text>
<rect class="chip" x="60" y="116" width="200" height="44" rx="10" />
<text class="line" x="76" y="143">2008 TVS Motor</text>
<rect class="chip" x="90" y="180" width="200" height="44" rx="10" />
<text class="line" x="106" y="207">2013 Projectplace</text>
<rect class="chip" x="60" y="244" width="200" height="44" rx="10" />
<text class="line" x="76" y="271">2015 Belong</text>
<rect class="out" x="90" y="308" width="200" height="44" rx="10" />
<text class="out-note" x="106" y="335">2019 Microsoft</text>
<text class="label" x="60" y="400">Press a stop for its roles and proofs</text>
</g>
<g id="sides">
<rect class="box" x="360" y="40" width="280" height="400" rx="18" />
<text class="name" x="380" y="72">Two sides</text>
<text class="note" x="380" y="94">the leader and the maker</text>
<rect class="out" x="376" y="116" width="120" height="240" rx="12" />
<text class="out-name" x="392" y="148">Leader</text>
<text class="out-note" x="392" y="176">Belong org</text>
<text class="out-note" x="392" y="198">Windows</text>
<text class="out-note" x="392" y="220">Strategy</text>
<rect class="docs" x="498" y="108" width="8" height="256" rx="4" />
<rect class="chip" x="508" y="116" width="116" height="240" rx="12" />
<text class="chip-name" x="524" y="148">Maker</text>
<text class="line" x="524" y="176">Cloner Pro</text>
<text class="line" x="524" y="198">Atiya</text>
<text class="line" x="524" y="220">Slate</text>
<text class="label" x="380" y="394">Drag, or press Leader or Maker</text>
<text class="label" x="380" y="414">After Diego Baca's “rare combination”</text>
</g>
<g id="brief">
<rect class="box" x="680" y="40" width="280" height="400" rx="18" />
<text class="name" x="700" y="72">The short version</text>
<text class="note" x="700" y="94">a one-page brief to share</text>
<rect class="chip" x="696" y="116" width="248" height="180" rx="12" />
<text class="chip-name" x="712" y="144">Prabin Pebam</text>
<text class="note" x="712" y="166">Principal Design Manager</text>
<text class="line" x="712" y="196">Each capability, one line</text>
<text class="line" x="712" y="222">Three voices</text>
<text class="line" x="712" y="248">Résumé and contact</text>
<rect class="chip" x="696" y="312" width="116" height="40" rx="10" />
<text class="line" x="712" y="337">Print</text>
<rect class="chip" x="824" y="312" width="120" height="40" rx="10" />
<text class="line" x="840" y="337">Copy link</text>
<text class="label" x="700" y="384">Also the link preview image</text>
</g>
<text class="label" x="40" y="480">Ideas for later: each could become a view of its own, or a part of one.</text>
<path class="arrow" d="M160 160 V177" />
<path class="arrow" d="M190 224 V241" />
<path class="arrow" d="M160 288 V305" />
</svg>
