<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, sans-serif">
  <title id="t">How the documentation fits together</title>
  <desc id="d">The site's seed spec and information architecture lead to the planet spec, plan and Definition of Done, which lead to the feature specs. The game UI design system applies to the planet and its features. Engineering sits under everything.</desc>
