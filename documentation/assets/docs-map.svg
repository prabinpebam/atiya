    <text x="370" y="118" font-size="16" fill="#35323d">Stack and interaction research</text>
    <text x="370" y="144" font-size="16" fill="#35323d">Art direction</text>
    <text x="370" y="170" font-size="16" fill="#35323d">Performance audit</text>
  </g>
