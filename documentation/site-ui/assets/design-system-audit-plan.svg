<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="Segoe UI, system-ui, sans-serif">
  <title id="t">Design-system fixes: seven workstreams on two tracks</title>
  <desc id="d">The site track runs WS1 (suite green), then WS2 (token ownership), then WS3 (one source for values), then WS7a (stories and large components); WS4 (script lifecycle) is independent. The game track runs WS5 (docs match the split), then WS6 (game tokens), then WS7b (game primitives). The two tracks can run in parallel.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a7f8c"/>
    </marker>
  </defs>
  <g font-size="13" fill="#1f2333">
    <rect x="10" y="20" width="84" height="120" rx="10" fill="#e9ebf7" stroke="#4b55c7"/>
    <text x="52" y="85" text-anchor="middle" font-weight="700" fill="#2f379a">Site</text>
    <rect x="10" y="190" width="84" height="120" rx="10" fill="#f5ecdf" stroke="#9a6a1f"/>
    <text x="52" y="255" text-anchor="middle" font-weight="700" fill="#6e4a12">Game</text>

    <g stroke="#4b55c7" fill="#ffffff">
      <rect x="120" y="40" width="170" height="80" rx="10"/>
      <rect x="330" y="40" width="170" height="80" rx="10"/>
      <rect x="540" y="40" width="190" height="80" rx="10"/>
      <rect x="770" y="40" width="180" height="80" rx="10"/>
      <rect x="500" y="140" width="270" height="40" rx="10" stroke-dasharray="5 4"/>
    </g>
    <text x="205" y="70" text-anchor="middle" font-weight="700">WS1 Suite green</text>
    <text x="205" y="92" text-anchor="middle">DS-01</text>
    <text x="415" y="70" text-anchor="middle" font-weight="700">WS2 Token ownership</text>
    <text x="415" y="92" text-anchor="middle">DS-02, DS-03</text>
    <text x="635" y="70" text-anchor="middle" font-weight="700">WS3 One source for values</text>
    <text x="635" y="92" text-anchor="middle">DS-04 to DS-08</text>
    <text x="860" y="70" text-anchor="middle" font-weight="700">WS7a Coverage, size</text>
    <text x="860" y="92" text-anchor="middle">DS-15, DS-16</text>
    <text x="635" y="165" text-anchor="middle">WS4 Script lifecycle: DS-09, any time</text>

    <g stroke="#9a6a1f" fill="#ffffff">
      <rect x="120" y="210" width="170" height="80" rx="10"/>
      <rect x="330" y="210" width="380" height="80" rx="10"/>
      <rect x="750" y="210" width="200" height="80" rx="10"/>
    </g>
    <text x="205" y="240" text-anchor="middle" font-weight="700">WS5 Docs match split</text>
    <text x="205" y="262" text-anchor="middle">DS-10</text>
    <text x="520" y="240" text-anchor="middle" font-weight="700">WS6 Game tokens: format, rem, enforcement</text>
    <text x="520" y="262" text-anchor="middle">DS-11, then DS-12, then DS-13</text>
    <text x="850" y="240" text-anchor="middle" font-weight="700">WS7b Game primitives</text>
    <text x="850" y="262" text-anchor="middle">DS-14</text>

    <g stroke="#7a7f8c" stroke-width="2" fill="none" marker-end="url(#a)">
      <line x1="290" y1="80" x2="326" y2="80"/>
      <line x1="500" y1="80" x2="536" y2="80"/>
      <line x1="730" y1="80" x2="766" y2="80"/>
      <line x1="290" y1="250" x2="326" y2="250"/>
      <line x1="710" y1="250" x2="746" y2="250"/>
    </g>
  </g>
</svg>
