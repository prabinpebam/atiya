<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome · Atiya Studio</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="setup.css">
<script type="module" src="welcome.js"></script>
</head>
<body>
<main class="page welcome" id="main">
  <h1>Your own site, live today</h1>
  <p class="lead">Atiya Studio makes you a portfolio site and publishes it with GitHub, free. Your GitHub username becomes its address.</p>
  <div class="actions">
    <button type="button" class="primary" id="make">Make my site</button>
    <button type="button" id="existing">Open my existing site</button>
  </div>
  <section class="developer" id="developer" hidden aria-labelledby="developer-title">
    <h2 id="developer-title">Working on the site's own code?</h2>
    <p class="muted small">This app was started from a checkout of the site's source. Open it to run its dev server and edit it here.</p>
    <button type="button" class="quiet" id="open-suggested">Open this checkout</button>
  </section>
</main>
</body>
</html>
