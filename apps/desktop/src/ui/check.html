<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Check my site · Atiya Studio</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="check.css">
<script type="module" src="check.js"></script>
</head>
<body>
<main class="page" id="main" aria-busy="true">
  <h1>Check my site</h1>
  <p class="lead muted" id="summary" role="status">Checking your site…</p>
  <ul class="checks" id="checks" aria-label="Checks"></ul>
  <div class="actions">
    <button type="button" class="primary" id="again">Check again</button>
    <button type="button" id="back">Back to edit mode</button>
  </div>
</main>
</body>
</html>
