<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Changed on two computers · Atiya Studio</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="check.css">
<script type="module" src="sync.js"></script>
</head>
<body>
<main class="page" id="main">
  <h1>Changed on two computers</h1>
  <p class="lead muted">These were changed here and on another computer since they were last saved. Choose which to keep for each; the other is set aside.</p>
  <ul class="checks" id="conflicts" aria-label="Changed on both"></ul>
  <div class="actions">
    <button type="button" class="primary" id="go" disabled>Keep my choices</button>
  </div>
  <p class="muted small" id="left" role="status"></p>
</main>
</body>
</html>
